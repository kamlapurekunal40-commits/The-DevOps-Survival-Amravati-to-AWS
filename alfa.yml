apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfa-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alfa
  template:
    metadata:
      labels:
        app: alfa
    spec:
      containers:
      - name: alfa-container
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: alfa-service
spec:
  type: NodePort
  selector:
    app: alfa
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32000